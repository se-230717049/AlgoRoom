name: Publish AlgoRoom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'

      - name: Prepare web target
        shell: bash
        run: |
          test -f pubspec.yaml || { echo 'pubspec.yaml is missing from the repository root'; exit 1; }
          test -f lib/features/authentication/data/firebase_auth_repository.dart || { echo 'Firebase Auth source file is missing'; exit 1; }
          if [[ ! -f web/index.html ]]; then
            scaffold="$(mktemp -d)/algoroom"
            flutter create --no-pub --platforms=web --project-name=algoroom "$scaffold"
            mkdir -p web
            cp -R "$scaffold/web/." web/
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web app with Firebase
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
        shell: bash
        run: |
          keys=(FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_AUTH_DOMAIN)
          defines=(--dart-define=ALGOROOM_AUTH=true)
          for key in "${keys[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions repository variable: $key"
              exit 1
            fi
            defines+=("--dart-define=$key=${!key}")
          done
          flutter build web --release --base-href "${PAGES_BASE_PATH%/}/" "${defines[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
